# Example P1 configuration for a 3CA-style cohort (adapt column names to your AnnData).
# Run:  mpaudit p1 cohort.h5ad --config configs/p1_3ca_example.yaml --out results/p1 --n-jobs 8
# Fill in the `decision` block (pre-declared lists) and freeze this file BEFORE running on real data.
# The whole file is checked before any NMF runs (unknown or pre-v1.0 decision keys, decoy arms not named in
# the rule, names that cannot match re-derived MPs, missing files): `mpaudit p1` stops with the reason.
# Write floats with a decimal point (1.0e-8, not 1e-8): YAML reads 1e-8 as a string.
keys:
  sample: sample            # NMF unit (one tumour sample)
  malignant: cell_type      # column marking malignant cells...
  malignant_label: Malignant  # ...and the value that means malignant (omit for a bool column)
  tumour: patient           # groups samples of the same tumour (twins, regions)
  study: study
  cancer_type: cancer_type
  cell_type: cell_type      # TME cell types; needed for the TME axis
  protocol: protocol        # e.g. fresh / fixed / nuclei; needed for the protocol axis
  clone: clone              # optional: CNA clone labels (Numbat/CopyKAT)
  doublet: doublet_score    # optional: scDblFinder score
  intronic: intronic_fraction  # optional: per-cell intronic/unspliced fraction (STARsolo/velocyto)
counts_layer: counts        # raw integer UMI counts (null = adata.X)
recurrence_key: patient     # a tumour must not "recur" with its own second sample
mps: rederive               # or a GMT of published MPs, e.g. the Gavish 2023 / 3CA v2 lists. Re-derived MPs are
                            # named MP1, MP2, ... by the run: pre-declare their exclusions as gene sets
n_jobs: 8
cache_dir: nmf_cache        # NMF fits are reused across perturbations and re-runs
qc:
  add_obs: true             # adds log_umi, log_genes, pct_mito, pct_ribo to obs if missing

gavish:                     # 3CA defaults; listed here to make the audited setting explicit
  ranks: [4, 5, 6, 7, 8, 9]
  nrun: 10
  n_universe: 7000
  intra_min: 35
  intra_max: 10
  inter_min: 10
  min_group_size: 5
  min_programs_per_mp: 5    # 3CA v2 post filters
  min_studies_per_mp: 2
  v2_gene_order: true       # 3CA v2 orders MP genes by study-deduplicated frequency
  min_genes_per_cell: 1000  # low-complexity cell filter used across 3CA scripts
  tol: 1.0e-7               # 1.0e-5 leaves top-50 lists unconverged; use 1.0e-8 for R parity runs (scripts/parity)

instability:
  enabled: true
  seeds: [1, 2, 3]
  n_boot: 3
  boot_fraction: 0.8
  leave_one_study_out: true

decoy:
  enabled: true
  n: 5                      # the rule needs >= 2 hits among >= 5 decoys per arm
  method: residual
  arms:                     # categorical columns -> permutation strata; continuous -> mean model; every arm
                            # must be listed in decision.technical_arms or decision.dosage_arms
    technical: [doublet_score, contamination, pct_ribo, intronic_fraction]  # add DecontX/SoupX estimates
    dosage: [clone]         # CNA clone recruitment types an MP as dosage, not nuisance
  n_depth_bins: 1

tme:
  enabled: true
  min_cells: 20
  n_boot: 200
  n_null: 500               # random gene sets matched on expression and malignant specificity
  covariates: [cancer_type]
  spillover_adjust: true    # subtract predicted malignant->TME ambient spillover (criterion b needs it)
  rho_sensitivity: 1.5      # re-run with every rho_hat x 1.5; criterion (b) must hold there too (null: off)

positional:
  enabled: true
  cytoband: ref/cytoBand.hg38.txt.gz   # UCSC cytoBand table
  gtf: ref/gencode.v44.basic.annotation.gtf.gz   # also gives gene lengths for the typer

typer:
  enabled: true
  labels: null              # CSV (mp,label): 1 for curated artefacts, e.g. the 11 MPs removed by hand in 3CA v2
  labelled_gmt: null        # GMT of the labelled (published) MPs, keyed like `labels`; needed with mps: rederive,
                            # where each re-derived MP takes the label of its best match (Jaccard >= 0.3)

protocol:
  enabled: true
  reference: fresh
  test: fixed
  min_pairs: 3              # distinct tumours with same-protocol replicate pairs needed for the replicate null
  n_null_sets: 100          # otherwise random matched gene sets in the same paired tumours
  kappa_min_effect: 0.4054651  # log(1.5): a kappa loss must also exceed 1.5-fold to count

decision:                   # P1-GO v1.1; defaults shown, pre-declared lists must be filled in
  expected_tme_shared: []   # names of audited MPs expected to co-vary with TME cells while real (e.g. IFN/MHC-II,
                            # hypoxia); only with mps: <GMT> (names of re-derived MPs are not known in advance)
  expected_tme_shared_gmt: null   # gene sets; an MP overlapping one by >= min_overlap genes is excluded from (b)
  min_overlap: 10
  technical_arms: [technical]
  dosage_arms: [dosage]
  min_decoys: 5
  min_hits: 2
  min_kappa_retained: 0.5
  a1_null: null_q99
  min_a1_samples: 10
  min_paired_tumours: 4
  protocol_frac: 0.5
  positional_q: 0.05
  min_mps: 3
